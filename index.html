<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title id="page-title">Google Ads Pro</title>
  <meta name="description" id="page-description" content="" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0d12;
      color: #ffffff;
      line-height: 1.6;
    }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(10, 12, 18, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1c1f2a;
      z-index: 1000;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    .lang-switch span {
      margin-left: 12px;
      cursor: pointer;
      opacity: 0.5;
    }

    .lang-switch span.active {
      opacity: 1;
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      padding: 160px 24px 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(700px 400px at 50% 0%, rgba(79,124,255,0.25), transparent 60%),
        radial-gradient(500px 300px at 80% 20%, rgba(255,255,255,0.06), transparent 70%);
      z-index: 0;
    }

    .hero-content {
      max-width: 900px;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 64px);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero p {
      font-size: 20px;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 14px 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f7cff, #6a8dff);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .btn-secondary {
      padding: 14px 28px;
      border-radius: 10px;
      border: 1px solid #2c3350;
      color: #fff;
      text-decoration: none;
      opacity: 0.85;
    }
  </style>
</head>

<body>

<header>
  <nav>
    <div class="logo">Google Ads Pro</div>
    <div class="lang-switch">
      <span data-lang="ru" onclick="setLang('ru')">RU</span>
      <span data-lang="de" onclick="setLang('de')">DE</span>
      <span data-lang="en" onclick="setLang('en')">EN</span>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_subtitle"></p>

    <div class="hero-buttons">
      <a href="#" class="btn-primary" data-i18n="cta_primary"></a>
      <a href="#" class="btn-secondary" data-i18n="cta_secondary"></a>
    </div>
  </div>
</section>

<script>
const translations = {
  ru: {
    title: "Google Ads Pro",
    description: "Профессиональное ведение и оптимизация Google Ads",
    hero_title: "Больше заявок из Google Ads",
    hero_subtitle: "Мы оптимизируем рекламу под результат, а не клики",
    cta_primary: "Получить аудит",
    cta_secondary: "Узнать больше"
  },
  de: {
    title: "Google Ads Betreuung",
    description: "Professionelle Google Ads Betreuung und Optimierung",
    hero_title: "Mehr Anfragen über Google Ads",
    hero_subtitle: "Wir optimieren Werbung für Ergebnisse, nicht für Klicks",
    cta_primary: "Kostenlosen Audit erhalten",
    cta_secondary: "Mehr erfahren"
  },
  en: {
    title: "Google Ads Expert",
    description: "Professional Google Ads management and optimization",
    hero_title: "More leads from Google Ads",
    hero_subtitle: "We optimize ads for results, not clicks",
    cta_primary: "Get free audit",
    cta_secondary: "Learn more"
  }
};

function setLang(lang) {
  document.documentElement.lang = lang;
  localStorage.setItem("lang", lang);

  document.getElementById("page-title").innerText = translations[lang].title;
  document.getElementById("page-description")
    .setAttribute("content", translations[lang].description);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerText = translations[lang][key];
  });

  document.querySelectorAll(".lang-switch span").forEach(s => {
    s.classList.toggle("active", s.dataset.lang === lang);
  });
}

setLang(localStorage.getItem("lang") || "ru");
</script>

</body>
</html>
