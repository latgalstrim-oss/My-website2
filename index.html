<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Ads Pro</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 32px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-primary {
      background-color: #2ecc71;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Превратите Google Ads из расхода в источник стабильных продаж</h1>
    <p>
      Профессиональная настройка и оптимизация рекламных кампаний
      для малого и среднего бизнеса в Европе и США
    </p>

    <div class="buttons">
      <a href="#" class="btn btn-primary">Получить бесплатный аудит</a>
      <a href="#" class="btn btn-secondary">Узнать больше</a>
    </div>
  </div>
</body>
</html>
