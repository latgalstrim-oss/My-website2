<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="page-title">Google Ads Pro</title>
<meta name="description" id="page-description" content="">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif;
    background: #0b0b0d;
    color: #fff;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(10,10,12,.9);
    border-bottom: 1px solid #222;
    z-index: 1000;
}

nav {
    max-width: 1200px;
    margin: auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-weight: 700;
    font-size: 18px;
}

.lang-switch span {
    margin-left: 12px;
    cursor: pointer;
    opacity: .6;
}

.lang-switch span.active {
    opacity: 1;
    font-weight: 700;
}

.hero {
    padding: 140px 24px 100px;
    text-align: center;
    max-width: 900px;
    margin: auto;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 16px;
}

.hero p {
    font-size: 18px;
    opacity: .85;
    margin-bottom: 32px;
}

.buttons a {
    display: inline-block;
    margin: 8px;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
}

.btn-primary {
    background: #4f7cff;
    color: #fff;
}

.btn-secondary {
    border: 2px solid #fff;
    color: #fff;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 24px;
    max-width: 900px;
    margin: 60px auto 0;
    text-align: center;
}

.stat span {
    display: block;
    font-size: 32px;
    font-weight: 700;
    color: #4f7cff;
}

footer {
    padding: 40px 24px;
    text-align: center;
    opacity: .6;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
<nav>
    <div class="logo">Google Ads Pro</div>
    <div class="lang-switch">
        <span data-lang="ru">RU</span>
        <span data-lang="en">EN</span>
        <span data-lang="de">DE</span>
    </div>
</nav>
</header>

<section class="hero">
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_subtitle"></p>
    <div class="buttons">
        <a href="#contact" class="btn-primary" data-i18n="cta_primary"></a>
        <a href="#services" class="btn-secondary" data-i18n="cta_secondary"></a>
    </div>

    <div class="stats">
        <div class="stat"><span>15+</span><div data-i18n="stat_1"></div></div>
        <div class="stat"><span>150+</span><div data-i18n="stat_2"></div></div>
        <div class="stat"><span>-40%</span><div data-i18n="stat_3"></div></div>
        <div class="stat"><span>x2</span><div data-i18n="stat_4"></div></div>
    </div>
</section>

<footer>
© 2026 Google Ads Pro
</footer>

<script>
const translations = {
ru: {
title: "Google Ads — больше заявок",
description: "Профессиональная настройка и оптимизация Google Ads",
hero_title: "Больше заявок из Google Ads",
hero_subtitle: "Настраиваем рекламу под результат, а не под клики",
cta_primary: "Получить аудит",
cta_secondary: "Узнать больше",
stat_1: "лет опыта",
stat_2: "проектов",
stat_3: "экономия бюджета",
stat_4: "рост заявок"
},
en: {
title: "Google Ads — More Leads",
description: "Professional Google Ads setup and optimization",
hero_title: "More Leads from Google Ads",
hero_subtitle: "We optimize campaigns for results, not clicks",
cta_primary: "Get Free Audit",
cta_secondary: "Learn More",
stat_1: "years of experience",
stat_2: "projects",
stat_3: "budget savings",
stat_4: "lead growth"
},
de: {
title: "Google Ads — Mehr Anfragen",
description: "Professionelle Google Ads Betreuung und Optimierung",
hero_title: "Mehr Anfragen über Google Ads",
hero_subtitle: "Wir optimieren Werbung für Ergebnisse, nicht Klicks",
cta_primary: "Kostenlosen Audit erhalten",
cta_secondary: "Mehr erfahren",
stat_1: "Jahre Erfahrung",
stat_2: "Projekte",
stat_3: "Budgeteinsparung",
stat_4: "mehr Anfragen"
}
};

function setLang(lang) {
document.documentElement.lang = lang;
localStorage.setItem("lang", lang);

document.getElementById("page-title").innerText = translations[lang].title;
document.getElementById("page-description").setAttribute("content", translations[lang].description);

document.querySelectorAll("[data-i18n]").forEach(el => {
const key = el.getAttribute("data-i18n");
el.innerText = translations[lang][key];
});

document.querySelectorAll(".lang-switch span").forEach(s => {
s.classList.toggle("active", s.dataset.lang === lang);
});
}

const savedLang = localStorage.getItem("lang");
const browserLang = navigator.language.slice(0,2);
const defaultLang = savedLang || (translations[browserLang] ? browserLang : "en");

setLang(defaultLang);

document.querySelectorAll(".lang-switch span").forEach(btn => {
btn.addEventListener("click", () => setLang(btn.dataset.lang));
});
</script>

</body>
</html>
