<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Google Ads Pro — рост заявок</title>
<meta name="description" content="Настройка и оптимизация Google Ads. Больше заявок, ниже стоимость, прозрачная аналитика.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="alternate" hreflang="en" href="en.html">
<link rel="alternate" hreflang="de" href="de.html">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{font-family:Inter,Arial,sans-serif;background:#0b0b0c;color:#fff}
section{scroll-snap-align:start;padding:96px 20px;max-width:1100px;margin:auto}
h1,h2{font-weight:700;letter-spacing:-.02em}
p{opacity:.85;line-height:1.6}
header{position:sticky;top:0;background:#0b0b0c;z-index:10;border-bottom:1px solid #222}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1100px;margin:auto}
.lang a{color:#888;text-decoration:none;margin-left:12px}
.lang a.active{color:#fff;font-weight:600}
.hero h1{font-size:48px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:40px}
.card{background:#151517;padding:28px;border-radius:16px;transition:.3s}
.card:hover{transform:translateY(-6px);background:#1d1d20}
.reveal{opacity:0;transform:translateY(40px);transition:1s}
.reveal.active{opacity:1;transform:none}
footer{text-align:center;padding:40px;color:#777}
@media(max-width:600px){.hero h1{font-size:34px}}
</style>
</head>

<body>

<header>
<nav>
<strong>Google Ads Pro</strong>
<div class="lang">
<a class="active" href="index.html">RU</a>
<a href="en.html">EN</a>
<a href="de.html">DE</a>
</div>
</nav>
</header>

<section class="hero reveal">
<h1>Больше заявок из Google Ads</h1>
<p>Настраиваем рекламу под результат, а не клики</p>
</section>

<section class="reveal">
<h2>Знакомые проблемы?</h2>
<div class="grid">
<div class="card">Бюджет уходит впустую</div>
<div class="card">Низкая конверсия</div>
<div class="card">Нет аналитики</div>
<div class="card">Нет времени разбираться</div>
</div>
</section>

<section class="reveal">
<h2>Почему выбирают нас</h2>
<p>Мы отвечаем за результат и работаем прозрачно</p>
</section>

<footer>© Google Ads Pro</footer>

<script>
const r=document.querySelectorAll('.reveal');
const onScroll=()=>r.forEach(e=>{
if(e.getBoundingClientRect().top<window.innerHeight-80)e.classList.add('active')
});
window.addEventListener('scroll',onScroll);onScroll();
</script>

</body>
</html>
